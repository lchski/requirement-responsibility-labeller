[project]
name = "requirement-responsibility-labeller"
version = "0.2.0"
description = "Itemizes TBS policy instruments into responsibilities and labels each with a responsible role."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.2",
    "pandas>=2.2",
    "anthropic>=2.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
